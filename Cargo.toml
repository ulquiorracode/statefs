[workspace]
members = [
    "core/statefs-core",
    "runtime/statefs-runtime",
    "codecs/statefs-codec-toml",
    "codecs/statefs-codec-bin",
    "codecs/statefs-codec-json",
    "adapters/path/statefs-adapter-path-core",
    "adapters/path/statefs-adapter-path-tokens",
    "adapters/path/statefs-adapter-path-handles",
    "adapters/opt/statefs-adapter-opt-cache",
    "adapters/opt/statefs-adapter-opt-simd",
    "adapters/opt/statefs-adapter-opt-mmap",
    "adapters/opt/statefs-adapter-opt-lockfree",
    "adapters/bridge/statefs-adapter-bridge-config",
    "adapters/compute/statefs-adapter-compute-rayon",
    "benches/matrix_bench",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["StateFS Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ulquiorracode/statefs"
description = "Universal Hierarchical State & Virtual Configuration Engine"
keywords = ["vfs", "state", "trie", "reactive", "config"]
categories = ["data-structures", "no-std", "filesystem"]
