[package]
name = "statefs-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Pure nanokernel for StateFS: segmented paths, universal values, and memory trie store"

[features]
default = ["std", "simd"]
std = []
simd = ["dep:memchr"]
serde = ["dep:serde"]

[dependencies]
memchr = { version = "2.7", default-features = false, optional = true }
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"], optional = true }

[dev-dependencies]
serde_json = "1.0"
criterion = { version = "0.5", features = ["html_reports"] }
config = { version = "0.14", default-features = false, features = ["toml"] }
toml = "0.8"
cap = "0.1"

[[bench]]
name = "trie_bench"
harness = false

[[bench]]
name = "enterprise_bench"
harness = false

[[bench]]
name = "server_prod_bench"
harness = false
